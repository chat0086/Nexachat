<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={
apiKey:"AIzaSyDwDjLlhRxNNfIFN1B9j4PUTqT0fq34y50",
authDomain:"nexachat-28ecc.firebaseapp.com",
projectId:"nexachat-28ecc",
storageBucket:"nexachat-28ecc.firebasestorage.app",
messagingSenderId:"367209102337",
appId:"1:367209102337:web:6f3a0e63b554f6dd145400",
measurementId:"G-JLQW9XPDL6"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

/* =====================================================
   VARIABLES
===================================================== */

let currentUser=null;
let currentProfile=null;

let listeners=[];

let selectedPrivateUser=null;
let selectedMessage=null;
let replyMessage=null;
let editingMessageId=null;

let globalUsersCache=[];

let globalSearchOpen=false;

/* =====================================================
   HELPERS
===================================================== */

const $=id=>document.getElementById(id);

function esc(value){
return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function toast(message){

const box=$("toast");

if(!box)return;

box.textContent=message;
box.style.display="block";

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{
box.style.display="none";
},2500);
}

function clearListeners(){

listeners.forEach(fn=>{
try{fn();}catch(e){}
});

listeners=[];
}

function addListener(fn){

if(typeof fn==="function"){
listeners.push(fn);
}
}

function show(html){

$("app").innerHTML=html;
}

function focusFirst(){

setTimeout(()=>{

const first=$(
"#app button:not(.hidden),#app input"
);

if(first){

try{
first.focus();
}catch(e){}

}

},120);
}

function timeText(timestamp){

if(!timestamp)return "";

let date;

try{

date=timestamp.toDate
?timestamp.toDate()
:new Date(timestamp);

}catch(e){

return "";

}

return date.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

function emailFromUsername(username){

return username
.trim()
.toLowerCase()
.replace(/[^a-z0-9]/g,"")
+"@nexachat.local";
}

function escapeAttribute(value){

return String(value||"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");
}

function userStatusText(user){

return user.online
?"● Online"
:"● Offline";
}

/* =====================================================
   KAIOS KEY SUPPORT
===================================================== */

document.addEventListener("keydown",function(e){

const active=document.activeElement;
const tag=active?active.tagName:"";

if(
tag==="INPUT" ||
tag==="TEXTAREA"
){

if(e.key==="Enter" &&
active.id==="globalInput"){

e.preventDefault();
sendGlobal();
}

if(e.key==="Enter" &&
active.id==="privateInput"){

e.preventDefault();
sendPrivate();
}

return;
}

if(e.key==="Backspace"){

e.preventDefault();

const back=document.querySelector(
"[data-back='true']"
);

if(back){

back.click();
return;

}

}

if(
e.key==="SoftLeft" ||
e.key==="F1"
){

const btn=document.querySelector(
"[data-soft-left='true']"
);

if(btn){
btn.click();
}

}

if(
e.key==="SoftRight" ||
e.key==="F2"
){

const btn=document.querySelector(
"[data-soft-right='true']"
);

if(btn){
btn.click();
}

}

});

/* =====================================================
   AUTH
===================================================== */

function loginScreen(){

clearListeners();

show(`
<div class="authWrap">

<div class="card">

<div class="logo">💬</div>

<h1>NexaChat</h1>

<input
id="loginUser"
placeholder="Username"
autocomplete="username">

<input
id="loginPass"
type="password"
placeholder="Password"
autocomplete="current-password">

<button
class="primaryBtn"
onclick="login()">
LOGIN
</button>

<button
class="secondaryBtn"
onclick="signupScreen()">
CREATE ACCOUNT
</button>

</div>

</div>
`);

focusFirst();
}

function signupScreen(){

clearListeners();

show(`
<div class="authWrap">

<div class="card">

<div class="logo">💬</div>

<h1>Create Account</h1>

<input
id="signupUser"
placeholder="Username"
autocomplete="username">

<input
id="signupPass"
type="password"
placeholder="Password"
autocomplete="new-password">

<button
class="primaryBtn"
onclick="signup()">
SIGN UP
</button>

<button
class="secondaryBtn"
onclick="loginScreen()">
BACK TO LOGIN
</button>

</div>

</div>
`);

focusFirst();
}

async function signup(){

const username=$("signupUser").value.trim();
const password=$("signupPass").value;

if(username.length<3){

toast("Username kam az kam 3 characters ka ho.");
return;

}

if(!/^[A-Za-z0-9_]+$/.test(username)){

toast("Username mein sirf letters, numbers aur _ use karo.");
return;

}

if(password.length<6){

toast("Password kam az kam 6 characters ka ho.");
return;

}

try{

const usernameLower=username.toLowerCase();

const check=await db
.collection("users")
.where("usernameLower","==",usernameLower)
.limit(1)
.get();

if(!check.empty){

toast("Ye username already use ho raha hai.");
return;

}

const email=emailFromUsername(username);

const cred=
await auth.createUserWithEmailAndPassword(
email,
password
);

await db
.collection("users")
.doc(cred.user.uid)
.set({

uid:cred.user.uid,

username:username,

usernameLower:usernameLower,

online:true,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp(),

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

toast("Account create ho gaya ❤️");

}catch(error){

toast(error.message);

}
}

async function login(){

const username=$("loginUser").value.trim();
const password=$("loginPass").value;

if(!username||!password){

toast("Username aur password dono likho.");
return;

}

try{

await auth.signInWithEmailAndPassword(
emailFromUsername(username),
password
);

}catch(error){

toast("Login failed: "+error.message);

}
}

/* =====================================================
   PROFILE / PRESENCE
===================================================== */

async function loadProfile(){

const ref=db
.collection("users")
.doc(currentUser.uid);

const snap=await ref.get();

if(!snap.exists){

await ref.set({

uid:currentUser.uid,

username:"User",

usernameLower:"user",

online:true,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp(),

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

currentProfile={
uid:currentUser.uid,
username:"User",
usernameLower:"user"
};

}else{

currentProfile=snap.data();

}

await setOnline(true);
}

async function setOnline(value){

if(!currentUser)return;

try{

await db
.collection("users")
.doc(currentUser.uid)
.update({

online:value,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp()

});

}catch(e){}

}

async function logout(){

try{

await setOnline(false);

}catch(e){}

clearListeners();

await auth.signOut();
}

window.addEventListener(
"beforeunload",
function(){

if(currentUser){
setOnline(false);
}

});

setInterval(function(){

if(currentUser){
setOnline(true);
}

},60000);

===================================================== */

show(`

/* =====================================================
   ONLINE USERS
===================================================== */

function onlineUsers(){

clearListeners();

show(`
<div class="screen">

<div class="header">

<div class="headerLeft">

<button
class="backBtn"
data-back="true"
onclick="home()">
‹
</button>

</div>

<div class="headerCenter">
<div class="title">Online Users</div>

<div class="headerRight"></div>

</div>

<div
id="onlineList"
class="content userList">

</div>

</div>

</div>

const unsub=db
.collection("users")
.where("online","==",true)
.onSnapshot(
snap=>{

let html="";

snap.forEach(doc=>{

if(doc.id===currentUser.uid)return;

const u=doc.data();

html+=`
<button
class="userItem"
onclick="openPrivate('${escapeAttribute(u.uid)}','${escapeAttribute(u.username)}')">

${esc(u.username)}
</div>

<div class="userStatus online">

</div>

$("onlineList").innerHTML=

},
error=>{

$("onlineList").innerHTML=
`<div class="empty">
${esc(error.message)}

);

const msgUnsub=db

const onlineUnsub=db
.collection("users")

.onSnapshot(
snap=>{

globalUsersCache=[];

function showMentionPopup(){

const input=$("globalInput");

if(!input)return;

const value=input.value;

const at=value.lastIndexOf("@");

if(at<0){

hideMentionPopup();
return;

}

const part=value
.substring(at+1)
.split(/\s/)[0]
.toLowerCase();

if(!part){

hideMentionPopup();
return;

}

const matches=globalUsersCache
.filter(u=>
u.username &&
u.username.toLowerCase().startsWith(part)
)
.slice(0,8);

const popup=$("mentionPopup");

if(!popup)return;

if(!matches.length){

hideMentionPopup();
return;

}

popup.innerHTML=matches
.map(u=>`
<button
class="popupBtn"
onclick="insertMention('${escapeAttribute(u.username)}')">
@${esc(u.username)}
</button>
`)
.join("");

popup.classList.remove("hidden");
}

function hideMentionPopup(){

const p=$("mentionPopup");

if(p){
p.classList.add("hidden");
}

}

function insertMention(username){

const input=$("globalInput");

if(!input)return;

const value=input.value;

const at=value.lastIndexOf("@");

input.value=
value.substring(0,at)
+"@"+username+" ";

input.focus();

hideMentionPopup();
}

async function cleanGlobalMessages(){

try{

const snap=await db
.collection("worldMessages")
.orderBy("timestamp","desc")
.limit(30)
.get();

if(snap.size<=10)return;

const docs=snap.docs.slice(10);

const batch=db.batch();

docs.forEach(doc=>{

/*
Only delete messages owned by the
current user because Firestore rules
protect other users' messages.
*/

if(doc.data().senderUid===currentUser.uid){

batch.delete(doc.ref);

}

});

await batch.commit();

}catch(e){}

}

async function cleanPrivateMessages(){

if(!currentUser||!selectedPrivateUser)return;

try{

const other=selectedPrivateUser.uid;

const a=await db
.collection("privateMessages")
.where("senderUid","==",currentUser.uid)
.where("receiverUid","==",other)
.orderBy("timestamp","desc")
.limit(30)
.get();

const b=await db
.collection("privateMessages")
.where("senderUid","==",other)
.where("receiverUid","==",currentUser.uid)
.orderBy("timestamp","desc")
.limit(30)
.get();

const map={};

a.forEach(d=>{
map[d.id]={ref:d.ref,...d.data()};
});

b.forEach(d=>{
map[d.id]={ref:d.ref,...d.data()};
});

const all=Object.entries(map)
.sort((x,y)=>{

const aTime=x[1].timestamp &&
x[1].timestamp.toMillis
?x[1].timestamp.toMillis()
:0;

const bTime=y[1].timestamp &&
y[1].timestamp.toMillis
?y[1].timestamp.toMillis()
:0;

return bTime-aTime;

});

const old=all.slice(10);

const batch=db.batch();

old.forEach(item=>{

/*
Firestore rules allow each user
to delete only their own messages.
*/

if(item[1].senderUid===currentUser.uid){

batch.delete(item[1].ref);

}

});

if(old.some(item=>
item[1].senderUid===currentUser.uid
)){

await batch.commit();

}

}catch(e){}
}

Ye action undo nahi hoga.

<input
id="deletePassword"
type="password"
placeholder="Enter password">

class="primaryBtn"

`);

focusFirst();
}

async function removeAccount(){

const password=$("deletePassword").value;

if(!password){

toast("Password enter karo.");
return;
}

const yes=confirm(
"Final confirmation: ID permanently remove karni hai?"
);

if(!yes)return;

try{

const credential=
firebase.auth.EmailAuthProvider.credential(
emailFromUsername(currentProfile.username),
password
);

await currentUser.reauthenticateWithCredential(
credential
);

const uid=currentUser.uid;

await db
.collection("users")
.doc(uid)
.delete();

await currentUser.delete();

toast("ID remove ho gayi.");

}catch(error){

toast(
"Remove failed: "+
(error.message||"Unknown error")
);

}
}

/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(
async user=>{

if(user){

currentUser=user;

try{

await loadProfile();

$("loading").style.display="none";

home();

}catch(error){

$("loading").style.display="none";

toast(error.message);

loginScreen();

}

}else{

currentUser=null;
currentProfile=null;

clearListeners();

$("loading").style.display="none";

loginScreen();

}

}
);

/* =====================================================
   LOADING SAFETY
===================================================== */

setTimeout(()=>{

if($("loading")){

$("loading").style.display="none";

}

},3500);

</script>
